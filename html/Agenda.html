<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../estilos/estilosAgen.css">
    <title>Panel del Paciente</title>
</head>

<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Inicio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" aria-current="page" href="HistoriaClini.html">Historia Clinica</a>
                    <a class="nav-link" href="Profesionales.html">Doctores</a>
                    <a class="nav-link" href="Agenda.html">Agendar hora</a>
                    <a class="nav-link" aria-disabled="true">Disabled</a>
                </div>
            </div>
        </div>
    </nav>
</header>
<br>

<body>
    <section>
        <div class="contenedor-agenda">
            <div class="header-icono">
                <h2>Consulta Médica</h2>
                <p>¿Qué tipo de atención buscas y dónde quieres atenderte?</p>
            </div>

            <form id="form-agenda" onsubmit="agendarCita(event)">

                <div class="campo">
                    <label for="especialidad">Especialidad</label>
                    <select id="especialidad" required onchange="actualizarPrestashon()">
                        <option value="Nutricionista" selected>Nutricionista</option>
                        <option value="Nutricionista infantil">Nutriólogo deportivo</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="prestacion">Tipo de consulta</label>
                    <select id="prestacion" required>
                        <option value="Consulta Nutricionista" selected>Consulta Nutricionista</option>
                        <option value="Control Nutricional">Control Nutricional</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="doctor">Doctor</label>
                    <select id="doctor" required>
                        <option value="Dr. Juan Pérez">Dr. Juan Pérez (Nutrición)</option>
                        <option value="Dra. María González">Dra. María González (Nutrición)</option>
                    </select>
                </div>

                <div class="campo-doble">
                    <div class="campo">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="campo">
                        <label for="hora">Hora</label>
                        <input type="time" id="hora" required>
                    </div>
                </div>

                <button type="submit" class="btn-agendar">Buscar / Agendar Cita</button>
            </form>
    </section>

    <div class="modal fade" id="modalResumen" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLabel">Cita creada con exito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" id="resumen-cita">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src=".../javaScript/Agendar.js"></script>
</body>
</html>
